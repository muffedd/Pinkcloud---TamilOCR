<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Cloud · Correction editor</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./ui.css">
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <span class="wordmark">
      <span class="logo-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8.6 4.5 4.5 0 0 0 7 18z"/></svg>
      </span>Pink Cloud
    </span>
    <nav class="page-badges" id="pageBadges" aria-label="Pages"></nav>
    <span class="spacer"></span>
    <div class="seg" id="modeToggle" role="radiogroup" aria-label="Review mode" data-active="0">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button type="button" class="seg-opt" role="radio" aria-checked="true" data-val="auto" tabindex="0">Auto</button>
      <button type="button" class="seg-opt" role="radio" aria-checked="false" data-val="review" tabindex="-1">Review</button>
    </div>
    <span class="offline-badge" id="connBadge" data-state="offline" role="status"><i class="pdot" aria-hidden="true"></i><span id="connText">Offline</span></span>
    <button type="button" class="btn btn--solid" id="exportBtn" disabled><span class="lb"><span>Export</span><span aria-hidden="true">Export</span></span></button>
  </header>

  <div class="panes">

    <section class="pane pane-scan" aria-label="Scan">
      <div class="pane-head">
        <span class="pane-title">Scan</span>
        <span class="pane-sub" id="scanSub">…</span>
        <span class="spacer"></span>
        <div class="seg seg--sm" id="heatToggle" role="radiogroup" aria-label="Heatmap" data-active="0">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" class="seg-opt" role="radio" aria-checked="true" data-val="off" tabindex="0">Plain</button>
          <button type="button" class="seg-opt" role="radio" aria-checked="false" data-val="on" tabindex="-1">Heatmap</button>
        </div>
      </div>
      <div class="scan-scroll" id="scanScroll">
        <div class="viewer">
          <div class="paper" id="paper"></div>
          <div class="heat-legend" id="heatLegend" hidden>
            <i class="h-auto" aria-hidden="true"></i>Auto
            <i class="h-ok" aria-hidden="true"></i>OK
            <i class="h-doubt" aria-hidden="true"></i>Doubt
          </div>
        </div>
      </div>
    </section>

    <section class="pane pane-text" aria-label="Text">
      <div class="pane-head">
        <span class="pane-title">Text</span>
        <span class="pane-sub">Unicode Tamil</span>
        <span class="spacer"></span>
        <div class="seg seg--sm" id="lensToggle" role="radiogroup" aria-label="Underline lens" data-active="0">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" class="seg-opt" role="radio" aria-checked="true" data-val="conf" tabindex="0">Confidence</button>
          <button type="button" class="seg-opt" role="radio" aria-checked="false" data-val="prov" tabindex="-1">Provenance</button>
        </div>
      </div>
      <div class="text-scroll" id="textScroll">
        <div class="text-body" id="textBody">
          <div id="textRows"></div>
          <div class="pop" id="fixPop" role="dialog" aria-label="Fix word" hidden></div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="pane pane-rail" aria-label="Review queue">
      <div class="pane-head">
        <span class="pane-title">Review</span>
        <span class="spacer"></span>
        <span class="warn-pill" id="leftPill">0 left</span>
      </div>
      <div class="rail-sub">
        <p id="railSub">…</p>
        <div class="progress" role="progressbar" aria-label="Review progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar"><i id="progressFill"></i></div>
      </div>
      <div class="queue" id="queue"></div>
      <div class="queue-empty" id="queueEmpty" hidden>
        <span class="empty-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </span>
        <h3 class="h3">Nothing left to review</h3>
        <p>Every flagged word on this page is fixed.</p>
      </div>
      <div class="rail-foot">
        <span class="hint"><span class="kbd">J</span>next</span>
        <span class="hint"><span class="kbd">K</span>prev</span>
        <span class="hint"><span class="kbd">↵</span>fix</span>
        <span class="spacer"></span>
        <button type="button" class="hint demo-open-btn" id="demoOpenBtn" aria-haspopup="dialog">
          <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.7 4.7v4.6L9.9 7z" fill="currentColor"/></svg>demo
        </button>
      </div>
    </section>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Watch-demo modal: same clip as the upload page (demo.mp4, repo root).
     Styles in editor.css (.demo-modal*); the inline wiring below is
     self-contained - editor.js logic is untouched. -->
<div class="demo-modal" id="demo-modal" hidden>
  <div class="demo-modal-backdrop" data-demo-close></div>
  <div class="demo-modal-card" role="dialog" aria-modal="true" aria-label="Pink Cloud demo video">
    <button type="button" class="demo-modal-close" data-demo-close aria-label="Close demo video">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.2 2.2l9.6 9.6M11.8 2.2l-9.6 9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <video class="demo-modal-video" src="./demo.mp4" preload="metadata" playsinline muted loop controls></video>
  </div>
</div>

<script>
(function () {
  var modal = document.getElementById('demo-modal');
  var openBtn = document.getElementById('demoOpenBtn');
  if (!modal || !openBtn) return;
  var video = modal.querySelector('video');
  var closeBtn = modal.querySelector('.demo-modal-close');
  function openDemo() {
    modal.hidden = false;
    document.body.classList.add('demo-open');
    if (video) { video.currentTime = 0; var p = video.play(); if (p && p.catch) p.catch(function () {}); }
    if (closeBtn) closeBtn.focus();
  }
  function closeDemo() {
    if (modal.hidden) return;
    if (video) video.pause();
    modal.hidden = true;
    document.body.classList.remove('demo-open');
    openBtn.focus();
  }
  openBtn.addEventListener('click', openDemo);
  modal.addEventListener('click', function (e) { if (e.target.closest('[data-demo-close]')) closeDemo(); });
  /* Registered before editor.js init: while the modal is open, keep the
     editor hotkeys (J/K/Enter) from stepping the queue behind it. */
  document.addEventListener('keydown', function (e) {
    if (modal.hidden) return;
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeDemo(); }
    else if (e.key === 'Enter' && document.activeElement === closeBtn) { e.preventDefault(); e.stopImmediatePropagation(); closeDemo(); }
    else if (k === 'j' || k === 'k' || e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); }
  });
})();
</script>

<script src="./api.js"></script>
<script src="./translit.js"></script>
<script src="./editor.js"></script>
</body>
</html>
