<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Cloud - Reading</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFF6EF; /* lightest Pink Cloud brand colour */
  }
  #shader {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* ---- demo caption: shows intended usage as a loading/reading state. Safe to remove. ---- */
  #caption {
    position: fixed;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: #1A1A1A; /* brand black accent */
    animation: captionPulse 2.4s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
  }
  @keyframes captionPulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>
<canvas id="shader"></canvas>
<div id="caption">READING</div>
<script>
(function () {
  var canvas = document.getElementById('shader');
  var gl = canvas.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) {
    document.body.style.background = 'linear-gradient(135deg,#FFF6EF,#FFE3C8)';
    return;
  }

  // Deterministic still frame for previews/tests: open with ?t=2.5
  var fixedT = null;
  var m = /[?&]t=([0-9.]+)/.exec(location.search);
  if (m) fixedT = parseFloat(m[1]);

  var VERT = [
    'attribute vec2 a_pos;',
    'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    'uniform vec2 u_res;',
    'uniform float u_time;',
    '',
    'float hash(vec2 p) {',
    '  p = fract(p * vec2(123.34, 456.21));',
    '  p += dot(p, p + 45.32);',
    '  return fract(p.x * p.y);',
    '}',
    '',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p);',
    '  vec2 f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash(i);',
    '  float b = hash(i + vec2(1.0, 0.0));',
    '  float c = hash(i + vec2(0.0, 1.0));',
    '  float d = hash(i + vec2(1.0, 1.0));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    '',
    'float fbm(vec2 p) {',
    '  float v = 0.0;',
    '  float amp = 0.55;',
    '  for (int i = 0; i < 5; i++) {',
    '    v += amp * noise(p);',
    '    p = p * 2.03 + vec2(19.7, 7.3);',
    '    amp *= 0.5;',
    '  }',
    '  return v;',
    '}',
    '',
    'void main() {',
    '  float mn = min(u_res.x, u_res.y);',
    '  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / mn;',
    '  float t = u_time;',
    '',
    '  // --- aurora distortion field ---',
    '  vec2 drift = vec2(t * 0.10, -t * 0.07);',
    '  float warp = fbm(uv * 2.1 + drift);',
    '  float warp2 = fbm(uv * 3.4 - drift * 1.3 + warp * 1.6);',
    '',
    '  // --- gentle ripple waves radiating from centre ---',
    '  float r = length(uv);',
    '  float rings = sin(r * 13.0 - t * 1.15 + warp * 4.5);',
    '  float ringField = rings * 0.5 + 0.5;',
    '  ringField = pow(ringField, 1.7);',
    '',
    '  // slow breathing pulse',
    '  float pulse = 0.5 + 0.5 * sin(t * 0.65);',
    '  ringField *= 0.5 + 0.5 * pulse;',
    '',
    '  // aurora ribbons flowing through the ripples',
    '  float ribbon = fbm(vec2(uv.x * 1.6 + warp2 * 1.2, uv.y * 2.8 - t * 0.22));',
    '  float ribbonMask = smoothstep(0.48, 0.78, ribbon);',
    '',
    '  float f = clamp(ringField * 0.75 + ribbonMask * 0.55 + warp2 * 0.10, 0.0, 1.0);',
    '',
    '  // --- Pink Cloud brand ramp on the lightest colour ---',
    '  vec3 bg      = vec3(1.000, 0.965, 0.937); // #FFF6EF lightest brand colour',
    '  vec3 lightOr = vec3(1.000, 0.800, 0.612); // light orange glow',
    '  vec3 orange  = vec3(1.000, 0.541, 0.239); // brand orange',
    '  vec3 darkOr  = vec3(0.773, 0.325, 0.051); // dark orange depth',
    '',
    '  vec3 col = bg;',
    '  col = mix(col, lightOr, smoothstep(0.12, 0.42, f));',
    '  col = mix(col, orange,  smoothstep(0.44, 0.74, f));',
    '  col = mix(col, darkOr,  smoothstep(0.60, 0.92, f) * 0.85);',
    '',
    '  // --- dot matrix: white dots ride the wave crests (reference-style dot field) ---',
    '  float cellSize = mn / 34.0;',
    '  vec2 g = gl_FragCoord.xy / cellSize;',
    '  g.x += step(1.0, mod(floor(g.y), 2.0)) * 0.5; // hex offset rows',
    '  vec2 cellId = floor(g);',
    '  vec2 cell = fract(g) - 0.5;',
    '  float d = length(cell);',
    '',
    '  float h = hash(cellId);',
    '  // dot radius swells with the field, small per-dot jitter',
    '  float dotR = 0.11 + 0.24 * f + 0.04 * h;',
    '  float dotMask = smoothstep(dotR, dotR - 0.09, d);',
    '',
    '  vec3 dotCol = vec3(1.0); // white dots',
    '  if (h > 0.986 && f > 0.62) dotCol = vec3(0.09); // sparse black accents, only embedded in strong waves',
    '',
    '  // dots exist only on the waves - no ambient sprinkle on calm background',
    '  float dotStrength = smoothstep(0.38, 0.72, f);',
    '  col = mix(col, dotCol, dotMask * dotStrength);',
    '',
    '  // soft glow bloom on the strongest crests',
    '  col += lightOr * 0.22 * smoothstep(0.7, 1.0, f) * (1.0 - dotMask);',
    '',
    '  // faint vignette to keep edges calm',
    '  float vig = smoothstep(1.25, 0.45, r);',
    '  col = mix(bg, col, 0.55 + 0.45 * vig);',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uTime = gl.getUniformLocation(prog, 'u_time');

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  var start = performance.now();
  function frame() {
    var t = fixedT !== null ? fixedT : (performance.now() - start) / 1000;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
