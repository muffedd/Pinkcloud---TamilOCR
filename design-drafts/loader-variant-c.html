<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pink Cloud - Reading page (shader variant C)</title>
<style>
  :root{
    --pc-bg-canvas:#FDFCFB; --pc-primary:#F94612; --pc-primary-end:#FA683D;
    --pc-primary-solid:#D93A0B; --pc-primary-active:#B32E08;
    --pc-primary-soft-border:#FFC9B3; --pc-text:#1E1A18; --pc-text-2:#655E58;
  }
  html,body{margin:0;height:100%;background:var(--pc-bg-canvas);overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .label{position:fixed;left:0;right:0;bottom:11vh;text-align:center;
    font:600 15px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--pc-text);letter-spacing:.02em}
  .label small{display:block;margin-top:6px;font-weight:500;font-size:12px;color:var(--pc-text-2);letter-spacing:.04em}
  .bar{width:120px;height:3px;border-radius:3px;background:#E6E2DE;margin:14px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:3px;
    background:linear-gradient(90deg,var(--pc-primary),var(--pc-primary-end));
    animation:slide 1.6s cubic-bezier(.34,1.56,.64,1) infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Reading page<span id="dots"></span><small>Pink Cloud is scanning your text</small><div class="bar"><i></i></div></div>
<script>
(function(){
  // ?t=SECONDS freezes the animation at that time (used for screenshots)
  const q = new URLSearchParams(location.search);
  const frozen = q.has('t') ? parseFloat(q.get('t')) : null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', {antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:true});
  if(!gl){ document.body.style.background='radial-gradient(circle at 50% 42%,#FA683D 0,#FFC9B3 22%,#FDFCFB 45%)'; return; }

  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = `
precision highp float;
uniform vec2 R; uniform float T; uniform float D;
// Pink Cloud tokens
const vec3 BG   = vec3(0.992,0.988,0.984);   // #FDFCFB canvas
const vec3 SOFT = vec3(1.000,0.788,0.702);   // #FFC9B3 light orange
const vec3 OR   = vec3(0.976,0.275,0.071);   // #F94612 primary
const vec3 OR2  = vec3(0.980,0.408,0.239);   // #FA683D gradient end
const vec3 DK   = vec3(0.702,0.180,0.031);   // #B32E08 dark orange
const vec3 INK  = vec3(0.118,0.102,0.094);   // #1E1A18 black

float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h31(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n3(p);p*=2.03;a*=.5;}return s;}

void main(){
  vec2 frag = gl_FragCoord.xy;
  float m = min(R.x,R.y);
  vec2 c = vec2(.5*R.x, .56*R.y);            // orb sits a bit above centre, label below
  // breathing with a soft overshoot
  float br = 1. + .025*sin(T*1.6) + .012*sin(T*3.7+1.);
  float r = .27*m*br;

  // ---- light background + orange bloom ----
  vec2 uv = (frag-c)/m;
  float d = length(uv)/(r/m);
  vec3 col = BG;
  float halo = exp(-pow(max(d-.55,0.)*1.35,2.));
  col = mix(col, SOFT, .85*halo);
  col = mix(col, OR2, .35*exp(-pow(max(d-.8,0.)*3.,2.)));
  // second, slower drifting glow lobe for life
  vec2 g2 = c + m*vec2(.18*cos(T*.35), .10*sin(T*.5));
  col = mix(col, SOFT, .35*exp(-pow(length(frag-g2)/(.42*m),2.)*2.));

  // ---- orb body ----
  float edge = smoothstep(1.0, .985, d);
  vec3 body = mix(OR2, OR, smoothstep(0.,.9,d));
  body = mix(body, DK, smoothstep(.55,1.,d)*.55 + .25*smoothstep(-.2,.9,(uv.y*-1.)/(r/m)));
  col = mix(col, body, edge);

  // ---- halftone globe: big, deliberate dots on a fixed grid ----
  float cell = max(13., m/46.);
  vec2 id = floor(frag/cell);
  vec2 cc = (id+.5)*cell;
  vec2 lp = (cc-c)/r;                        // cell centre in orb space
  float l2 = dot(lp,lp);
  if(l2 < .96){
    vec3 sp = vec3(lp, sqrt(1.-l2));
    float a = T*.22;                          // slow rotation
    sp.xz = mat2(cos(a),-sin(a),sin(a),cos(a))*sp.xz;
    sp.yz = mat2(cos(.35),-sin(.35),sin(.35),cos(.35))*sp.yz;
    float land = fbm(sp*2.1 + vec3(0.,0.,T*.04));
    float light = clamp(.35 + .75*dot(normalize(vec3(-.4,.5,.8)), vec3(lp, sqrt(1.-l2))),0.,1.);
    float rim = smoothstep(.96,.62,l2);
    // scan pulse sweeping down the orb - "reading" rhythm
    float scan = exp(-pow((lp.y - (1.2-mod(T*.55,2.4)))*3.2,2.));
    float v = smoothstep(.46,.60,land);
    float pd = length(frag-cc)/cell;          // 0 at cell centre
    // filled dot where "land", ring where "sea" (like the dot-matrix reference)
    float rad = mix(.26, .40, v) * mix(.85,1.,light);
    rad += .05*scan;
    float fill = smoothstep(rad+.04, rad-.04, pd) * v;
    float ring = smoothstep(.05,.0,abs(pd-.30))*(1.-v)*.55;
    float dotA = (clamp(fill + ring, 0., 1.) * (.55+.45*light) + .35*scan*fill) * rim;
    col = mix(col, vec3(1.), clamp(dotA,0.,1.)*edge);
  }

  // ---- black accent: thin orbit ring with a travelling marker ----
  float orbR = r*1.22;
  float od = abs(length(frag-c)-orbR);
  float ang = atan(frag.y-c.y, frag.x-c.x);
  float arc = smoothstep(.0,.6, sin(ang*1. - T*1.1)) ;
  col = mix(col, INK, smoothstep(1.2,0.,od)*.55*arc);
  vec2 mk = c + orbR*vec2(cos(T*1.1+1.5708), sin(T*1.1+1.5708));
  float mkd = length(frag-mk);
  col = mix(col, INK, smoothstep(8.,6.5,mkd));
  col = mix(col, vec3(1.), smoothstep(3.6,2.4,mkd));

  // ---- film grain (per-pixel, per-frame) ----
  float g = h21(frag + fract(T*7.13)*917.) - .5;
  col += g * .045 * (.6 + .6*edge);
  gl_FragColor = vec4(col,1.);
}`;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T');
  function size(){const dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;gl.viewport(0,0,cv.width,cv.height);}
  addEventListener('resize',size);size();
  const t0=performance.now(); const dots=document.getElementById('dots');
  function frame(now){
    if(cv.width!==Math.round(innerWidth*Math.min(devicePixelRatio||1,2))) size();
    const t = frozen!==null ? frozen : (reduce ? 2.0 : (now-t0)/1000);
    gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t);gl.drawArrays(gl.TRIANGLES,0,3);
    dots.textContent='.'.repeat(1+Math.floor(t*2)%3);
    if(frozen===null && !reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
