<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pink Cloud - icon motion, variant B (draw-on)</title>
<style>
:root{
  --bg:#FDFCFB; --surface:#FFFFFF; --subtle:#F8F6F4; --hover:#F1EEEB;
  --border-subtle:#E6E2DE; --border:#D2CCC6;
  --text:#1E1A18; --text-2:#655E58;
  --orange:#F94612; --orange-end:#FA683D; --dark-orange:#D93A0B; --deep:#B32E08;
  --soft:#FFF4EF; --soft-border:#FFC9B3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;gap:40px;padding:40px;align-items:flex-start;justify-content:center}
/* sidebar mock */
.side{width:248px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(30,26,24,.04),0 8px 24px rgba(30,26,24,.04)}
.chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--subtle);margin-bottom:14px}
.av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--orange),var(--orange-end));color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.chip b{font-size:13px;font-weight:600;display:block}
.chip small{font-size:11px;color:var(--text-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--text-2);cursor:pointer;user-select:none}
.item:hover{background:var(--hover);color:var(--text)}
.item.on{background:var(--soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--soft-border)}
.item svg{width:22px;height:22px;flex:none;overflow:visible}
.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);padding:14px 10px 6px}
/* showcase grid */
.stage{max-width:760px}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--text-2);margin:6px 0 22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tile{position:relative;aspect-ratio:1;border-radius:22px;background:var(--surface);border:1px solid var(--border-subtle);display:grid;place-items:center;cursor:pointer;overflow:visible;box-shadow:0 1px 2px rgba(30,26,24,.04)}
.tile .glow{position:absolute;inset:-8px;border-radius:30px;background:radial-gradient(closest-side,rgba(249,70,18,.28),rgba(250,104,61,.12) 55%,rgba(255,201,179,0) 100%);opacity:0;pointer-events:none;filter:blur(6px)}
.tile svg{width:46%;height:46%;overflow:visible;position:relative}
.tile label{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--text-2);pointer-events:none}
.grid{row-gap:40px}
.foot{margin-top:40px;font-size:12px;color:var(--text-2)}
.foot kbd{font:inherit;background:var(--subtle);border:1px solid var(--border-subtle);border-radius:6px;padding:1px 6px}
@media (max-width:1100px){body{flex-direction:column;align-items:center}}
</style>
</head>
<body>
<aside class="side">
  <div class="chip"><div class="av">S</div><div><b>Sutharshan</b><small>Pink Cloud workspace</small></div></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="stage">
  <h1>Icon motion - variant B: draw-on</h1>
  <p class="sub">Each stroke draws itself, then the fill springs in and settles with a bounce. Hover or click any icon to replay.</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Loops every 4.2s. <kbd>Space</kbd> replays all. Colors from tokens.css: #F94612, #D93A0B, #FA683D, #FFC9B3, #1E1A18 on #FDFCFB.</p>
</main>
<script>
/* ---------- icon set (24x24). s = strokes, f = fill shape, d = dot anchors for white sparkle ---------- */
const ICONS = {
  projects:{label:"Projects",
    s:["M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.2h8.5A1.5 1.5 0 0 1 21 9.7v7.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z","M3 11h18"],
    f:"M3.8 11.6h16.4v5.9a.8.8 0 0 1-.8.8H4.6a.8.8 0 0 1-.8-.8z", d:[[8,15],[12,15],[16,15]]},
  assets:{label:"Assets",
    s:["M6 4.5h12.5a1.5 1.5 0 0 1 1.5 1.5v10","M3.5 8.5A1.5 1.5 0 0 1 5 7h11a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 16 20H5a1.5 1.5 0 0 1-1.5-1.5z","M4 18l4.2-4.4 3 3 2-2L17 18","M13.3 9.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3"],
    f:"M4.2 18.4l4-4.1 3 3 2-2 3.6 3.1zM13.3 9.8a1.2 1.2 0 1 0 0 2.4a1.2 1.2 0 1 0 0-2.4", d:[[8.2,17.2]]},
  scan:{label:"Scan page",
    s:["M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8","M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8","M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16","M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16","M8 9h8","M8 12h8","M8 15h5"],
    f:"M6.5 7h11v10h-11z", d:[[9.5,10.5],[14.5,13.5]]},
  editor:{label:"Editor",
    s:["M14.5 5.5l4 4","M4 20l1-4.2L15.8 5a1.8 1.8 0 0 1 2.6 0l.6.6a1.8 1.8 0 0 1 0 2.6L8.2 19z","M13 20h7"],
    f:"M5.4 16.2L15.6 6l2.4 2.4L7.8 18.6 4.9 19.1z", d:[[10.5,12.5]]},
  search:{label:"Search",
    s:["M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13","M16 16l4.5 4.5"],
    f:"M11 6.2a4.8 4.8 0 1 0 0 9.6a4.8 4.8 0 1 0 0-9.6", d:[[9.2,9.4],[12.6,12.4]]},
  upload:{label:"Upload",
    s:["M12 15V4","M7.5 8.5L12 4l4.5 4.5","M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"],
    f:"M5.2 16.5h13.6v2.3H5.2z", d:[[8,17.6],[12,17.6],[16,17.6]]},
  history:{label:"History",
    s:["M12 3.5a8.5 8.5 0 1 1-8.2 6.3","M3.5 4.5v5h5","M12 7.5V12l3 2"],
    f:"M12 5.3a6.7 6.7 0 1 0 0 13.4a6.7 6.7 0 1 0 0-13.4", d:[[12,12]]},
  settings:{label:"Settings",
    s:["M4 7h9","M17 7h3","M4 17h3","M11 17h9","M15 4.8a2.2 2.2 0 1 0 0 4.4a2.2 2.2 0 1 0 0-4.4","M9 14.8a2.2 2.2 0 1 0 0 4.4a2.2 2.2 0 1 0 0-4.4"],
    f:"M15 5.3a1.7 1.7 0 1 0 0 3.4a1.7 1.7 0 1 0 0-3.4M9 15.3a1.7 1.7 0 1 0 0 3.4a1.7 1.7 0 1 0 0-3.4", d:[[15,7],[9,17]]}
};
const NAV = [["projects",1],["assets",0],["scan",0],["editor",0],["history",0]];
const GRID = ["projects","assets","scan","editor","search","upload","history","settings"];

/* ---------- easing ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
// damped spring 0->1 with overshoot; zeta<1 gives the bounce
function spring(t,{w=14,z=.38}={}){ if(t<=0) return 0; const wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
// draw easing: fast start, soft landing with a small elastic tail (clamped so dashes never wrap)
const drawEase=t=>{t=clamp(t);const b=1-Math.pow(1-t,3);return clamp(b+Math.sin(t*Math.PI)*.06);};

/* ---------- build ---------- */
const NS="http://www.w3.org/2000/svg"; let uid=0; const units=[];
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}
function buildIcon(name,host,{sw=1.6,big=false}={}){
  const I=ICONS[name], id="g"+(uid++);
  const svg=mk("svg",{viewBox:"0 0 24 24",fill:"none"});
  const defs=mk("defs",{},svg);
  const lg=mk("linearGradient",{id,x1:"0",y1:"0",x2:"1",y2:"1"},defs);
  mk("stop",{offset:"0",  "stop-color":"#FA683D"},lg); mk("stop",{offset:"1","stop-color":"#D93A0B"},lg);
  const fillG=mk("g",{},svg);
  const fill=mk("path",{d:I.f,fill:`url(#${id})`,"fill-rule":"evenodd"},fillG);
  const strokes=I.s.map(d=>mk("path",{d,stroke:"#D93A0B","stroke-width":sw,"stroke-linecap":"round","stroke-linejoin":"round"},svg));
  const dots=(I.d||[]).map(([x,y])=>mk("circle",{cx:x,cy:y,r:big?.85:.9,fill:"#FFFFFF"},svg));
  host.prepend(svg);
  const lens=strokes.map(p=>p.getTotalLength());
  strokes.forEach((p,i)=>{p.style.strokeDasharray=lens[i]+" "+lens[i];p.style.strokeDashoffset=lens[i];});
  // fill scale origin = bbox centre of fill
  const bb=fill.getBBox(); const cx=bb.x+bb.width/2, cy=bb.y+bb.height/2;
  const u={svg,fillG,fill,strokes,lens,dots,cx,cy,start:0,host,big};
  units.push(u); return u;
}
const nav=document.getElementById("nav");
NAV.forEach(([n,on],i)=>{
  if(i===2){const s=document.createElement("div");s.className="sec";s.textContent="Workspace";nav.appendChild(s);}
  const it=document.createElement("div");it.className="item"+(on?" on":"");
  const t=document.createElement("span");t.textContent=ICONS[n].label;it.appendChild(t);nav.appendChild(it);
  const u=buildIcon(n,it,{sw:1.7}); u.delay=.08*i;
  it.addEventListener("mouseenter",()=>replay(u)); it.addEventListener("click",()=>replay(u));
});
const grid=document.getElementById("grid");
GRID.forEach((n,i)=>{
  const t=document.createElement("div");t.className="tile";
  const g=document.createElement("div");g.className="glow";t.appendChild(g);
  const l=document.createElement("label");l.textContent=ICONS[n].label;t.appendChild(l);
  grid.appendChild(t);
  const u=buildIcon(n,t,{sw:1.5,big:true}); t.prepend(g); u.glow=g; u.tile=t; u.delay=.35+.09*i;
  t.addEventListener("mouseenter",()=>replay(u)); t.addEventListener("click",()=>replay(u));
});

/* ---------- timeline per icon (seconds from its start) ----------
   0.00-0.75  strokes draw on, staggered per stroke (dark orange)
   0.55       fill springs in from 55% scale, overshoot + settle
   0.70       stroke color eases dark orange -> near black
   0.80       white dots pop with their own spring
   0.60-1.4   orange glow blooms then fades to a soft rest
*/
const LOOP=4.2, qs=new URLSearchParams(location.search), FIXED=qs.has("t")?parseFloat(qs.get("t")):null;
const t0=performance.now();
const now=()=>FIXED!==null?FIXED:(performance.now()-t0)/1000;
function replay(u){u.manual=now();}
function mix(a,b,t){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return"rgb("+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(",")+")";}
function render(u,T){
  const n=u.strokes.length, drawDur=.75;
  u.strokes.forEach((p,i)=>{
    const s=i*(drawDur*.45/Math.max(1,n-1||1)), d=drawDur*.6;
    const k=drawEase((T-s)/d); p.style.strokeDashoffset=u.lens[i]*(1-k);
    p.setAttribute("stroke",mix("#D93A0B","#1E1A18",clamp((T-.7)/.35)));
  });
  const fs=spring(T-.55,{w:15,z:.34}); const sc=.55+.45*fs;
  u.fillG.setAttribute("transform",`translate(${u.cx} ${u.cy}) scale(${sc}) translate(${-u.cx} ${-u.cy})`);
  u.fill.style.opacity=clamp((T-.55)/.18)*.95;
  u.dots.forEach((c,i)=>{const k=spring(T-.8-i*.07,{w:20,z:.3});c.setAttribute("r",(u.big?.85:.8)*Math.max(0,k));c.style.opacity=clamp((T-.8-i*.07)/.1);});
  // whole-icon micro pop as the fill lands
  const pop=1+.08*Math.sin(clamp((T-.5)/.5)*Math.PI)*(1-clamp((T-.9)/.6));
  u.svg.style.transform=`scale(${pop})`;
  if(u.glow){const g=clamp((T-.55)/.25)*(1-.65*clamp((T-.95)/.6)); u.glow.style.opacity=g;
    u.tile.style.transform=`scale(${.96+.04*spring(T,{w:12,z:.45})})`;}
}
function frame(){
  const t=now();
  for(const u of units){
    let T;
    if(u.manual!=null && t-u.manual<LOOP) T=t-u.manual;
    else { T=((t-u.delay)%LOOP+LOOP)%LOOP; if(t<u.delay) T=0; }
    render(u,T);
  }
  if(FIXED===null) requestAnimationFrame(frame);
}
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();const t=now();units.forEach(u=>u.manual=t+u.delay);}});
frame();
</script>
</body>
</html>
