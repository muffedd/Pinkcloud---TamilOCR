<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Cloud · Library</title>
<!--
  Pink Cloud - Library: every job on this backend, plus search over the
  corrected text. A search hit opens editor.html?job=<id>&page=<n>.
  Data: PC_API.listJobs (api.js) -> GET /jobs and GET /jobs?q=term
  (assumed contract, schema/library-endpoint.md). ?mock=1 runs an offline
  fixture in library.js; ?api=<origin> points at another backend.
-->
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./ui.css">
<link rel="stylesheet" href="./library.css">
</head>
<body>
<div class="lib-app">

  <aside class="lib-side" aria-label="Main">
    <span class="lib-wordmark">
      <span class="lib-logo-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8.6 4.5 4.5 0 0 0 7 18z"/></svg>
      </span>Pink Cloud
    </span>
    <nav class="lib-nav">
      <a class="lib-nav-item" id="navUpload" href="./index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5V2.5M4.8 5.7L8 2.5l3.2 3.2M2.5 10.5v2a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
        Upload
      </a>
      <a class="lib-nav-item is-active" href="./library.html" aria-current="page">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11M2.5 8h11M2.5 12.5h11"/></svg>
        Library
      </a>
    </nav>
  </aside>

  <main class="lib-main">
    <div class="lib-wrap">
      <a class="btn btn--outline btn--sm pc-back" data-back href="./index.html" data-back-fallback="#navUpload" title="Go back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3.5M7 4.5 3.5 8 7 11.5"/></svg><span class="lb"><span>Back</span><span aria-hidden="true">Back</span></span></a>
      <header class="lib-head">
        <h1 class="h3">Library</h1>
        <p class="pane-sub lib-count" id="libCount" role="status">Loading jobs…</p>
      </header>

      <label class="lib-search" for="libSearch">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4l3.1 3.1"/></svg>
        <input type="search" id="libSearch" class="lib-search-input" placeholder="Search text" autocomplete="off" spellcheck="false" aria-label="Search text">
        <span class="kbd" aria-hidden="true">/</span>
      </label>

      <div class="lib-notice" id="libNotice" hidden></div>

      <section class="card lib-card" id="libList" aria-label="Jobs"></section>
    </div>
  </main>

</div>

<script src="./api.js"></script>
<script src="./library.js"></script>
<script src="./nav-back.js"></script>
</body>
</html>
