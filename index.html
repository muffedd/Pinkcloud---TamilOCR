<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Cloud · Upload</title>
<!--
  Pink Cloud - product shell, page 1 of 3 (layout plan: upload -> editor -> export).
  upload.js mounts the upload screen into #upload-root; files upload on add
  (POST /jobs, poll GET /jobs/{id}) and Next step hands the job ids to the editor.
  The correction editor (page 2) is editor.html. Fonts load from ./fonts/ via ui.css.
-->
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./ui.css">
<link rel="stylesheet" href="./upload.css">
<link rel="stylesheet" href="./intro.css">
<link rel="stylesheet" href="./sidebar.css">
</head>
<body>
<!-- Landing intro (design-drafts/pinkcloud-intro.html), once per session,
     skippable. Must stay the first thing in <body> so the page never flashes
     before the sheet covers it. ?intro=0 turns it off, ?intro=1 replays. -->
<script src="./intro.js"></script>

<!-- upload.js renders the whole upload screen here (stepper, drop zone,
     file list, Previous/Next). "Next step" opens editor.html?job=<job_id>. -->
<div id="upload-root"></div>

<!-- App sidebar (sidebar.css): workspace chip + Documents (Library) + Scans.
     Replaces the old floating Library button. Links carry ?mock / ?api. -->
<aside class="pc-side" aria-label="Pink Cloud">
  <div class="pc-chip">
    <span class="logo-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8.6 4.5 4.5 0 0 0 7 18z"/></svg></span>
    <span class="pc-chip-name">Pink Cloud</span>
  </div>
  <nav class="pc-nav" aria-label="Main">
    <a class="pc-nav-item" id="navDocuments" href="./library.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Documents</a>
    <span class="pc-nav-item is-soon" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>Scans<span class="pc-soon">soon</span></span>
  </nav>
</aside>
<script>
(function () {
  var qs = new URLSearchParams(location.search), q = new URLSearchParams();
  if (qs.has("mock") && qs.get("mock") !== "0") q.set("mock", "1");
  if (qs.get("api")) q.set("api", qs.get("api"));
  if (q.toString()) document.getElementById("navDocuments").search = "?" + q.toString();
})();
</script>


<!-- Watch-demo modal: opened from the empty-state "Watch demo" button.
     Styles live in upload.css (.demo-modal*); open/close wiring in upload.js.
     The clip (demo.mp4, repo root) is the scripted upload -> editor walkthrough. -->
<div class="demo-modal" id="demo-modal" hidden>
  <div class="demo-modal-backdrop" data-demo-close></div>
  <div class="demo-modal-card" role="dialog" aria-modal="true" aria-label="Pink Cloud demo video">
    <button type="button" class="demo-modal-close" data-demo-close aria-label="Close demo video">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.2 2.2l9.6 9.6M11.8 2.2l-9.6 9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <video class="demo-modal-video" src="./demo.mp4" preload="metadata" playsinline muted loop controls></video>
  </div>
</div>

<script src="./upload.js"></script>
</body>
</html>
